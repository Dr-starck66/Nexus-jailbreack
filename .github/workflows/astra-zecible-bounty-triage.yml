name: ASTRA ZECIBLE critical targets bounty triage

on:
  push:
    branches:
      - astra/zecible-public-runner-20261114
    paths:
      - .github/workflows/astra-zecible-bounty-triage.yml

permissions:
  contents: read

jobs:
  in-scope-landing-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect three critical-scope public landing pages only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, datetime, json
          hosts=['ywh.verify.zecible.fr','ywh.mydata.zecible.fr','ywh.api.zecible.fr']
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirects)
          report=[]
          for host in hosts:
              url='https://'+host+'/'
              req=urllib.request.Request(url,headers={'User-Agent':'ASTRA-ZECIBLE-ScopedResearch/1.0 Drstarck','Accept':'text/html,application/json,*/*'},method='GET')
              item={'host':host,'method':'GET','redirects_followed':False}
              try:
                  with opener.open(req, timeout=8) as response:
                      item['status']=response.status
                      item['mime']=response.headers.get('Content-Type','').split(';')[0]
                      item['bytes_sampled']=len(response.read(4096))
              except urllib.error.HTTPError as e:
                  item['status']=e.code
                  item['mime']=e.headers.get('Content-Type','').split(';')[0]
                  item['bytes_sampled']=0
              except (urllib.error.URLError,TimeoutError) as e:
                  item['error_type']=type(e).__name__
              report.append(item)
          print('ASTRA_SCOPED_TRIAGE='+json.dumps({'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'public_login_or_landing_only':True,'user_data_copied':False,'vulnerability_confirmed':False,'results':report},sort_keys=True))
          PY
