name: ASTRA ZECIBLE public form schema audit

on:
  push:
    branches:
      - astra/zecible-public-runner-20261114
    paths:
      - .github/workflows/astra-zecible-form-introspection.yml

permissions:
  contents: read

jobs:
  public-form-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public form schema, without posting or reading user files
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlsplit
          from hashlib import sha256
          import json, datetime, re

          url='https://ywh.fichiers.zecible.fr/'
          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]
                  self.current=None
                  self.scripts=[]
                  self.inline_scripts=0
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='form':
                      self.current={'method':(a.get('method') or 'GET').upper(),
                          'action_path':urlsplit(a.get('action') or '/').path,
                          'id':a.get('id'),'fields':[]}
                      self.forms.append(self.current)
                  if tag in ('input','select','textarea') and self.current is not None:
                      # Only field types/names, never values, tokens or user data
                      self.current['fields'].append({'element':tag,'name':a.get('name'),
                          'type':a.get('type') if tag=='input' else None,
                          'required':('required' in a)})
                  if tag=='script' and a.get('src'):
                      u=urlsplit(a['src'])
                      if not u.netloc or u.netloc=='ywh.fichiers.zecible.fr':
                          self.scripts.append(u.path)
                  if tag=='script' and not a.get('src'):
                      self.inline_scripts+=1
              def handle_endtag(self, tag):
                  if tag=='form': self.current=None

          req=Request(url,headers={'User-Agent':'ASTRA-ZECIBLE-ScopedResearch/1.0 Drstarck','Accept':'text/html'},method='GET')
          with build_opener(NoRedirects).open(req,timeout=12) as response:
              status=response.status
              ctype=response.headers.get('Content-Type','').split(';')[0]
              data=response.read(512001)
          if status!=200 or ctype!='text/html' or len(data)>512000:
              raise SystemExit('Unexpected response; no form data printed')
          parser=FormParser()
          parser.feed(data.decode('utf-8','replace'))
          output={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'target':url,'http':status,'mime':ctype,'bytes':len(data),'sha256':sha256(data).hexdigest(),
              'forms':parser.forms,'same_host_script_paths':sorted(set(parser.scripts)),
              'inline_script_tags':parser.inline_scripts,'form_submission_performed':False,
              'user_file_access':False,'vulnerability_confirmed':False}
          print('ASTRA_PUBLIC_FORM_SCHEMA='+json.dumps(output,sort_keys=True))
          PY
