name: ASTRA ZECIBLE one-shot public JS audit

on:
  push:
    branches:
      - astra/zecible-public-runner-20261114
    paths:
      - .github/workflows/astra-zecible-one-shot.yml

permissions:
  contents: read

jobs:
  safe-public-js:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public JavaScript via one scoped GET (no user data)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, re, urllib.request, urllib.error
          url = "https://ywh.fichiers.zecible.fr/fichiers.js"
          ua = "ASTRA-ZECIBLE-ScopedResearch/1.0 Drstarck"
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(url, headers={"User-Agent":ua, "Accept":"text/javascript"}, method="GET")
          output = {"time_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"target":url,"request_method":"GET","redirects_followed":False,"vulnerability_confirmed":False}
          try:
              with urllib.request.build_opener(NoRedirects).open(req, timeout=12) as resp:
                  output["http_status"] = resp.status
                  output["content_type"] = resp.headers.get("Content-Type", "").split(";")[0]
                  payload = resp.read(1048577)
              if len(payload) > 1048576: raise ValueError("response_limit_exceeded")
              if output["http_status"] != 200: raise ValueError("unexpected_http_status")
              if output["content_type"] not in ("text/javascript","application/javascript","application/x-javascript","text/plain","application/octet-stream"):
                  raise ValueError("unexpected_content_type")
              output["byte_count"] = len(payload)
              output["sha256"] = hashlib.sha256(payload).hexdigest()
              text = payload.decode("utf-8", "replace")
              lines = text.splitlines()
              patterns = {
                  "formdata": r"\bFormData\b",
                  "dom_sink": r"\binnerHTML\s*=|\bdocument\.write\s*\(|\beval\s*\(",
                  "file_identifier":r"\bfile(?:id|Id|_id)?\b|\b(?:uuid|downloadToken|shareToken)\b",
                  "xhr":r"\bXMLHttpRequest\b",
                  "fetch":r"\bfetch\s*\(",
                  "jquery_ajax":r"\$\s*\.\s*(?:ajax|get|post)\s*\(",
                  "url_query":r"\bURLSearchParams\b|\blocation\.search\b",
                  "location_href":r"\blocation\.href\b",
              }
              output["static_flags"] = {name:{"present":bool(re.search(expr,text,re.I)), "line_count":sum(bool(re.search(expr,line,re.I)) for line in lines)} for name,expr in patterns.items()}
              # Evidence-only local source tracing; string literals and comments are hidden
              # from PUBLIC job logs. No network call is made during these inspections.
              qlit = re.compile(r'''("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\x60(?:\\.|[^\x60\\])*\x60)''')
              def redact(line):
                  line = qlit.sub('"[redacted literal]"', line)
                  line = re.sub(r"/\*.*?\*/|//.*$", "", line)
                  return line.strip()[:220]
              sink_indices = [i for i,line in enumerate(lines) if re.search(patterns["dom_sink"], line, re.I)]
              form_indices = [i for i,line in enumerate(lines) if re.search(patterns["formdata"], line, re.I)]
              nav_indices = [i for i,line in enumerate(lines) if re.search(patterns["location_href"], line, re.I)]
              input_indices = [i for i,line in enumerate(lines) if re.search(r"\b(?:getElementById|querySelector|addEventListener|\.value\b|\.files\b|onchange|onsubmit|JSON\.parse|\.responseText|\.html\s*\(|\.text\s*\()", line, re.I)]
              selected = set()
              for i in sink_indices:
                  selected.update(range(max(0,i-18),min(len(lines),i+19)))
              for i in form_indices:
                  selected.update(range(max(0,i-8),min(len(lines),i+9)))
              for i in nav_indices:
                  selected.update(range(max(0,i-4),min(len(lines),i+5)))
              for i in input_indices:
                  selected.update(range(max(0,i-1),min(len(lines),i+2)))
              output["flow"] = {
                  "sink_line_numbers":[i+1 for i in sink_indices],
                  "formdata_line_numbers":[i+1 for i in form_indices],
                  "navigation_line_numbers":[i+1 for i in nav_indices],
                  "input_candidate_line_numbers":[i+1 for i in input_indices],
                  "sanitized_code_context":[{"line":i+1,"code":redact(lines[i])} for i in sorted(selected)[:130]],
                  "additional_targeted_lines":[{"line":i+1,"code":redact(lines[i])} for i in sorted(set(list(range(0,min(len(lines),24))) + list(range(77,min(len(lines),146))) + list(range(163,min(len(lines),187)))))],
                  "interpretation":"sanitized code, not a security proof; string literals concealed",
              }
              output["source_lines"] = len(lines)
              output["analysis_status"] = "PARTIAL"
          except (urllib.error.URLError, ValueError, TimeoutError) as e:
              output["analysis_status"] = "BLOCKED"
              output["error_type"] = type(e).__name__
              output["error_detail"] = str(e)[:96]
          print("ASTRA_PUBLIC_JS_RESULT="+json.dumps(output,sort_keys=True))
          if output["analysis_status"] != "PARTIAL": raise SystemExit(2)
          PY
